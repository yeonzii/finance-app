spring.application.name=finance-app

# H2 파일 DB (데이터 영구 저장)
spring.datasource.url=jdbc:h2:file:./data/financedb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA 설정
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 콘솔 (브라우저에서 DB 직접 조회 가능: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# 최초 실행 시 data.sql 자동 삽입 (create 모드일 때만 실행하려면 embedded 유지)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
