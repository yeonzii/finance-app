spring.application.name=finance-app

# ── MySQL (Docker) ──────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/financedb?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=finance
spring.datasource.password=finance1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

server.port=8080

# ── 초기 데이터: 최초 1회 실행 후 never로 변경 ────────
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
